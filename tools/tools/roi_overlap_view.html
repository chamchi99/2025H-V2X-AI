<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>cam202/cam203 ROI overlap 검증</title>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.js"></script>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.4.0/mapbox-gl.css" rel="stylesheet">
<style>
  body{margin:0;padding:0} #map{position:absolute;top:0;bottom:0;width:100%}
  #legend{position:absolute;top:10px;left:10px;z-index:1;background:rgba(0,0,0,.7);
    color:#fff;padding:10px 14px;font:13px sans-serif;border-radius:6px}
  .sw{display:inline-block;width:12px;height:12px;margin-right:6px;vertical-align:middle}
</style>
</head>
<body>
<div id="legend">
  <div><span class="sw" style="background:#ff0000"></span>cam202 coverage</div>
  <div><span class="sw" style="background:#0000ff"></span>cam203 coverage (zoom)</div>
  <div><span class="sw" style="background:#00ff00"></span>overlap (중복발생 구역)</div>
</div>
<div id="map"></div>
<script>
mapboxgl.accessToken = 'pk.eyJ1IjoibWtzaGluIiwiYSI6ImNtbXR6N2I4MTFpcTYycW9qNGh5anhjM3QifQ.1Ih9E2M5tDDTRDjNndvg6A';
const map = new mapboxgl.Map({
  container:'map', style:'mapbox://styles/mapbox/satellite-streets-v12',
  center:[127.3669, 36.3825], zoom:18
});
map.addControl(new mapboxgl.NavigationControl(),'top-right');
map.on('load', () => {
  fetch('cam_roi_overlap.geojson?t='+Date.now())
    .then(r=>r.json())
    .then(geo=>{
      map.addSource('roi',{type:'geojson',data:geo});
      // 채움
      map.addLayer({id:'roi-fill',type:'fill',source:'roi',
        paint:{'fill-color':['get','fill'],'fill-opacity':0.25}});
      // 외곽선
      map.addLayer({id:'roi-line',type:'line',source:'roi',
        paint:{'line-color':['get','fill'],'line-width':2}});
      // overlap만 강조
      map.addLayer({id:'roi-overlap',type:'fill',source:'roi',
        filter:['==',['get','cam'],'overlap'],
        paint:{'fill-color':'#00ff00','fill-opacity':0.5}});
    })
    .catch(e=>alert('cam_roi_overlap.geojson load 실패: '+e));
});
</script>
</body>
</html>

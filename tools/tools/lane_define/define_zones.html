<script>
// ============================================================

//  src    : .py 안에서 그 변수를 찾을 위치

//  images : 배경으로 쓸 수 있는 프레임 목록. 첫 번째가 기본값.
//           ref:true  = .py 의 좌표가 찍힌 기준 프레임
//           ref:false = 화각/줌/해상도가 다른 프레임
//           load      = 열 때 .py 값을 올릴지 여부 (생략하면 ref 값을 따름).
//                       load:true + ref:false = "새 프리셋에 기존 점을 얹어 얼마나 어긋나는지 확인"
//  procSize : main.py 가 실제로 처리하는 프레임 해상도 (좌표계 기준)
// ============================================================
const IMG_DIR = '../../../doc/_debug_artifacts';
const PY_PATH = '../../ch_setting_comb.py';

const CAMERAS = {

    polys: [

        init:[[851,0],[1919,1006],[1919,1079],[0,1079],[0,0]] },
    ],
  },
  cam2: {
    procSize: [1920, 1080],
    images: [
      // { file:'cam2_preset3_260825A.png', label:'★ 실증지 preset3 2026-08-25 (.py 점 얹어서 확인)', ref:false, load:true },
      // { file:'cam2_260825A.png',  label:'실증지 2026-08-25 (화각/줌 다름 · 새로 찍기)', ref:false },
      { file:'20260825171926700.png', label:'개발 프레임 2026-08-25 (260519에서 내려서 맞춘 것, 저장4번)', ref:true },

    ],

    polys: [
      { var:'mask',   label:'검출 마스크',  dest:'ch_line_rotate() 내부', color:'#22d3ee', src:'rotate',
        init:[[627,232],[1018,613],[3,821],[2,1077],[1912,1077],[1915,547],[973,188]] },
      { var:'lane_1', label:'Re-ID 대상 차선', dest:'ch_line_rotate() 내부', color:'#a78bfa', src:'rotate',
        init:[[632,233],[986,184],[1916,566],[1916,1076],[3,1078],[4,820],[1040,602],[634,238]] },
      { var:'parking_cam2', label:'주차구역 (검출 제외)', dest:'모듈 최상단 (함수 밖) — 이 안의 차량은 미검출', color:'#fb923c', src:'module',
        init:[[617,232],[998,607],[1206,557],[775,211]] },
      { var:'sidewalk_cam2',  label:'sidewalk (인도)',      dest:'모듈 최상단 — 보행자 구역', color:'#22c55e', src:'module',
        init:[[6,643],[753,529],[544,272],[643,249],[1006,619],[960,663],[539,735],[1,761]] },
      { var:'crosswalk_cam2', label:'crosswalk (횡단보도)', dest:'모듈 최상단 — 보행자 구역', color:'#facc15', src:'module',
        init:[[460,1076],[539,735],[960,663],[954,1073]] },
      { var:'road_cam2',      label:'road (차도)',          dest:'모듈 최상단 — 보행자 구역', color:'#f87171', src:'module',
        init:[[632,233],[986,184],[1916,566],[1916,1076],[3,1078],[4,820],[1040,602]] },
    ],
  },

    ],

    polys: [
      { var:'sidewalk_cam3',  label:'sidewalk (인도)',      dest:'모듈 최상단 — 보행자 구역', color:'#22c55e', src:'module',
        init:[[650,697],[1520,712],[1585,1077],[650,1076]] },
      { var:'crosswalk_cam3', label:'crosswalk (횡단보도)', dest:'모듈 최상단 — 보행자 구역', color:'#facc15', src:'module',

let camId    = 'cam2';
let polys    = [];      // 현재 카메라의 poly 정의 목록
let points   = {};      // var -> [[x,y],...]   (화면에서 편집중인 값, 배경 이미지 픽셀 좌표)
let baseline = {};      // var -> [[x,y],...]   (.py 에서 읽은 적용값. 없으면 init)
let status   = {};      // var -> 'sync' | 'drift' | 'local'
let visible  = {};      // var -> bool
let current  = null;
let imgIdx   = 0;       // 현재 배경 프레임 인덱스
let scaleOut = 'raw';   // 'raw' = 이미지 픽셀 그대로 / 'proc' = procSize 로 환산
let showRef  = true;    // .py 적용값을 흐린 참조선으로 겹쳐 그리기
let pyVars   = null;
let img      = new Image();
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');

function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function key(pt) { return pt[0] + ',' + pt[1]; }
function curImg()  { return CAMERAS[camId].images[imgIdx]; }
function procSize(){ return CAMERAS[camId].procSize; }

// ── ch_setting_comb.py 파싱 ────────────────────────────────────────────────
//  `name = np.array([[x,y],...], np.int32)` 형태만 인식.
//  줄 맨 앞이 변수명이어야 하므로 `# mask = np.array(...)` 주석은 자동으로 무시된다.
const RE_ASSIGN = /^[ \t]*([A-Za-z_]\w*)[ \t]*=[ \t]*np\.array\(\s*\[([\s\S]*?)\]\s*,\s*np\.int32\s*\)/gm;
const RE_POINT  = /\[\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*\]/g;

function parsePoints(body) {
  const out = [];
  let m;
  RE_POINT.lastIndex = 0;
  while ((m = RE_POINT.exec(body)) !== null) {
    out.push([Math.round(parseFloat(m[1])), Math.round(parseFloat(m[2]))]);
  }
  return out;
}

function scanAssignments(text) {
  const map = {};
  let m;
  RE_ASSIGN.lastIndex = 0;
  while ((m = RE_ASSIGN.exec(text)) !== null) {
    const pts = parsePoints(m[2]);
    if (pts.length) map[m[1]] = pts;   // 같은 이름이 여러 번이면 마지막 것이 남음
  }
  return map;
}

function parsePy(src) {
  // mask / lane_1 은 ch_line() 과 ch_line_rotate() 양쪽에 있다.
  // main.py 가 실제로 쓰는 건 ch_line_rotate() 쪽(main.py:879)이므로 그 블록만 따로 스캔.
  const blk = src.match(/def\s+ch_line_rotate\s*\([\s\S]*?\n[ \t]*return[^\n]*\n/);
  return {
    module: scanAssignments(src),
    rotate: blk ? scanAssignments(blk[0]) : {},
  };
}

async function loadPy() {
  const banner = document.getElementById('srcBanner');
  try {
    const res = await fetch(PY_PATH + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    pyVars = parsePy(await res.text());
    const n = Object.keys(pyVars.module).length + Object.keys(pyVars.rotate).length;
    banner.className = 'src-ok';
    banner.innerHTML = `✔ <b>ch_setting_comb.py</b> 에서 ${n}개 폴리곤 로드 — 화면 값 = 실제 적용값`;
  } catch (e) {
    pyVars = null;
    banner.className = 'src-warn';
    banner.innerHTML =
      `✖ ch_setting_comb.py 를 못 읽음 (${e.message}) → 내장 init 값으로 표시.<br>` +
      `file:// 로 열면 fetch 가 막힙니다. HV2X 루트에서<br>` +
      `<b>python3 -m http.server 8888</b> 실행 후<br>` +
      `<b>localhost:8888/codes/tools/lane_define/define_zones.html</b> 로 여세요.`;
  }
}

// ── 카메라 / 배경 로드 ─────────────────────────────────────────────────────
function loadCamera(id) {
  camId  = id;
  polys  = CAMERAS[id].polys;
  imgIdx = 0;
  points = {}; baseline = {}; status = {}; visible = {};
  polys.forEach(p => {
    const fromPy = pyVars ? pyVars[p.src === 'rotate' ? 'rotate' : 'module'][p.var] : null;
    baseline[p.var] = fromPy ? deepCopy(fromPy) : deepCopy(p.init);
    status[p.var]   = !fromPy ? 'local' : (same(fromPy, p.init) ? 'sync' : 'drift');
    points[p.var]   = deepCopy(baseline[p.var]);
    visible[p.var]  = true;
  });
  current = polys[0].var;
  document.getElementById('targetNote').textContent = '→ ' + CAMERAS[id].target;

  // 배경 프레임 셀렉트 채우기
  const isel = document.getElementById('imgSel');
  isel.innerHTML = CAMERAS[id].images
    .map((im, k) => `<option value="${k}">${im.label}</option>`).join('');
  isel.value = '0';

  buildSidebar();
  applyImage();
}

// load 가 지정돼 있으면 그대로, 없으면 ref 를 따른다.
//  - 올림(true)  : .py 값을 얹어 배경과 얼마나 맞는지 확인 / 그 위에서 미세조정
//  - 비움(false) : 화각이 완전히 달라 기존 점이 의미 없을 때 새로 찍기
function applyImage() {
  const im = curImg();
  const preload = ('load' in im) ? im.load : im.ref;
  if (preload) polys.forEach(p => points[p.var] = deepCopy(baseline[p.var]));
  else         polys.forEach(p => points[p.var] = []);
  // 기준 프레임이 아니면 "이미지 그대로" 는 위험 → procSize 환산을 기본값으로
  scaleOut = im.ref ? 'raw' : 'proc';
  updatePtCount();
  img.src = IMG_DIR + '/' + im.file + '?t=' + Date.now();   // onload 에서 canvas 크기 + draw
}

function selectImage(k) { imgIdx = parseInt(k, 10); applyImage(); }

function scaleFactor() {
  const [pw, ph] = procSize();
  if (scaleOut !== 'proc' || !img.width || !img.height) return [1, 1];
  return [pw / img.width, ph / img.height];
}

function toOut(pt) {
  const [fx, fy] = scaleFactor();
  return [Math.round(pt[0] * fx), Math.round(pt[1] * fy)];
}

function refreshGeoUI() {
  const im  = curImg();
  const [pw, ph] = procSize();
  const iw = img.width, ih = img.height;
  const sameSize = (iw === pw && ih === ph);
  const sameAspect = Math.abs((iw / ih) - (pw / ph)) < 0.01;

  // 해상도가 같으면 환산할 게 없다 → 무조건 '이미지 그대로'
  if (sameSize) scaleOut = 'raw';

  // 출력 좌표 기준 셀렉트
  const ssel = document.getElementById('scaleSel');
  ssel.innerHTML =
    `<option value="raw">이미지 픽셀 그대로 (${iw}×${ih})</option>` +
    `<option value="proc">${pw}×${ph} 로 환산 (×${(pw/iw).toFixed(3)}, ×${(ph/ih).toFixed(3)})</option>`;
  ssel.value = scaleOut;
  ssel.disabled = sameSize;

  const gb = document.getElementById('geoBanner');
  if (im.ref && sameSize) {
    gb.className = 'src-ok';
    gb.innerHTML = `✔ 기준 프레임 (${iw}×${ih}) — .py 좌표와 같은 좌표계`;
  } else {
    gb.className = sameSize ? 'src-note' : 'src-warn';
    let msg = sameSize
      ? `⚠ <b>${im.file}</b> — ${iw}×${ih} <b>(처리 해상도와 일치 · 배율 환산 불필요)</b><br>`
      : `⚠ <b>${im.file}</b> — ${iw}×${ih}, 처리 해상도는 ${pw}×${ph}<br>`;
    if (!im.ref) msg += `화각/줌이 .py 기준 프레임과 다름 → 폴리곤을 <b>전부 새로</b> 찍으세요 (자동으로 비워둠).<br>`;
    if (!sameSize) msg += `해상도가 다름 → "출력 좌표 기준"을 <b>${pw}×${ph} 환산</b>으로 두면 코드 생성 시 자동 배율 적용.<br>`;
    if (!sameAspect) msg += `<b>화면비 불일치</b> (${(iw/ih).toFixed(2)} vs ${(pw/ph).toFixed(2)}) — 이 이미지가 잘렸거나 늘어난 것이면 배율 환산만으로는 안 맞습니다. 처리 해상도 원본으로 다시 캡처하는 게 안전합니다.`;
    gb.innerHTML = msg;
  }
}

const BADGE = {
  sync:  ['b-sync',  '.py 와 일치',        '내장 init 값과 .py 값이 같음'],
  drift: ['b-drift', '.py 값으로 표시중',  '내장 init 이 낡음 — .py 의 실제 적용값을 표시'],
  local: ['b-local', '.py 에 없음',        '.py 에서 이 변수를 못 찾아 init 으로 폴백'],
};

function buildSidebar() {
  const ctrl = document.getElementById('polyControls');
  ctrl.innerHTML = '';
  polys.forEach(p => {
    const [cls, txt, tip] = BADGE[status[p.var]];
    const div = document.createElement('div');
    div.className = 'poly-section';
    div.innerHTML = `
      <div class="poly-title" style="color:${p.color}">▶ ${p.label}
        <span style="color:#64748b">(${p.var})</span>
        <span class="badge ${cls}" title="${tip}">${txt}</span>
        <span class="badge b-edit" id="edit_${p.var}" style="display:none">편집됨(미저장)</span>
      </div>
      <div class="poly-pts" id="pts_${p.var}"></div>
      <div class="poly-py" id="py_${p.var}"></div>
      <div class="btnrow">
        <button class="btn ${p.var===current?'active':''}" id="btn_${p.var}"
          onclick="selectPoly('${p.var}')">선택</button>
        <button class="btn small" id="vis_${p.var}"
          onclick="toggleVis('${p.var}')">숨기기</button>
      </div>`;
    ctrl.appendChild(div);
  });
  // 각 구역의 "지금 .py 에 실제로 적용된 값" 을 항상 표시 (배경/편집 상태와 무관)
  polys.forEach(p => {
    const el = document.getElementById('py_'+p.var);
    if (!el) return;
    const b = baseline[p.var];
    el.innerHTML = `<b>.py 적용값</b> (${b.length} pts): ` +
      b.map(pt=>`(${pt[0]},${pt[1]})`).join(' ');
  });
  updatePtCount();
}

function selectPoly(v) {
  current = v;
  polys.forEach(p => {
    const b = document.getElementById('btn_'+p.var);
    if (b) b.classList.toggle('active', p.var===v);
  });
  draw();
}

function toggleVis(v) {
  visible[v] = !visible[v];
  const b = document.getElementById('vis_'+v);
  if (b) b.textContent = visible[v] ? '숨기기' : '보이기';
  draw();
}

function updatePtCount() {
  polys.forEach(p => {
    const el = document.getElementById('pts_'+p.var);
    if (el) el.textContent = points[p.var].length + ' pts: ' +
      points[p.var].map(pt=>`(${pt[0]},${pt[1]})`).join(' ');
    const eb = document.getElementById('edit_'+p.var);
    if (eb) eb.style.display = same(points[p.var], baseline[p.var]) ? 'none' : '';
  });
  updateShared();
}

// ── 공유 꼭짓점: 2개 이상 구역에 똑같이 들어있는 점 ─────────────────────────
function sharedMap() {
  const m = {};
  polys.forEach(p => {
    if (!visible[p.var]) return;
    const seen = new Set();
    points[p.var].forEach(pt => {
      const k = key(pt);
      if (seen.has(k)) return;         // 같은 폴리곤 안 중복은 1회만
      seen.add(k);
      (m[k] = m[k] || []).push(p.var);
    });
  });
  Object.keys(m).forEach(k => { if (m[k].length < 2) delete m[k]; });
  return m;
}

function updateShared() {
  const box = document.getElementById('sharedBox');
  const m = sharedMap();
  const ks = Object.keys(m);
  if (!ks.length) { box.textContent = '공유 꼭짓점 없음 (구역 경계가 서로 안 맞물림)'; return; }
  box.innerHTML = ks.map(k => `<b>(${k})</b> ← ${m[k].join(' + ')}`).join('<br>');
}

img.onload = () => {
  canvas.width  = img.width;
  canvas.height = img.height;
  refreshGeoUI();
  draw();
};

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('mousedown', e => {
  const [x, y] = toImg(e);
  if (e.button === 0)      points[current].push([x, y]);
  else if (e.button === 2) points[current].pop();
  updatePtCount();
  draw();
});
canvas.addEventListener('mousemove', e => {
  const [x, y] = toImg(e);
  const o = toOut([x, y]);
  const extra = (o[0] !== x || o[1] !== y) ? ` → 출력 (${o[0]}, ${o[1]})` : '';
  document.getElementById('info').textContent = `좌표: (${x}, ${y})${extra}`;
});

function toImg(e) {
  const rect = canvas.getBoundingClientRect();
  const sx = canvas.width  / rect.width;
  const sy = canvas.height / rect.height;
  return [Math.round((e.clientX - rect.left) * sx),
          Math.round((e.clientY - rect.top)  * sy)];
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(img, 0, 0);
  const sc = canvas.width / 1920;                  // 저해상도 배경에서도 마커가 안 뭉치도록
  const R  = Math.max(3, 6 * sc), Rs = Math.max(2, 3 * sc);

  // ── .py 적용값 참조선 (흐린 점선). 지금 찍는 값과 다를 때만 겹쳐 그린다 ──
  if (showRef) {
    polys.forEach(p => {
      const b = baseline[p.var];
      if (!b || b.length < 2 || !visible[p.var]) return;
      if (same(b, points[p.var])) return;          // 똑같으면 겹쳐 그릴 필요 없음
      ctx.strokeStyle = p.color + '77';
      ctx.lineWidth = 1;
      ctx.setLineDash([4, 5]);
      ctx.beginPath();
      ctx.moveTo(b[0][0], b[0][1]);
      b.forEach(pt => ctx.lineTo(pt[0], pt[1]));
      if (b.length > 2) ctx.closePath();
      ctx.stroke();
      ctx.setLineDash([]);
      b.forEach(pt => {
        ctx.strokeStyle = p.color + '99';
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(pt[0], pt[1], Rs, 0, Math.PI*2); ctx.stroke();
      });
      ctx.fillStyle = p.color + '99';
      ctx.font = `${Math.max(9, 11*sc)}px monospace`;
      ctx.fillText('.py ' + p.var, b[0][0] + 6, b[0][1] - 6);
    });
  }

  polys.forEach(p => {
    const pts = points[p.var];
    if (!pts || pts.length === 0 || !visible[p.var]) return;
    const isCur = p.var === current;
    ctx.strokeStyle = p.color;
    ctx.fillStyle   = p.color + '33';
    ctx.lineWidth   = isCur ? 3 : 1.5;
    ctx.setLineDash(isCur ? [] : [6,3]);
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    pts.forEach(pt => ctx.lineTo(pt[0], pt[1]));
    if (pts.length > 2) ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.setLineDash([]);
    pts.forEach((pt, i) => {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(pt[0], pt[1], isCur ? R : Rs, 0, Math.PI*2);
      ctx.fill();
      if (isCur) {
        ctx.fillStyle = '#fff';
        ctx.font = `bold ${Math.max(10, 13*sc)}px monospace`;
        ctx.fillText(i, pt[0]+8, pt[1]-5);
      }
    });
    const cx = pts.reduce((s,q)=>s+q[0],0)/pts.length;
    const cy = pts.reduce((s,q)=>s+q[1],0)/pts.length;
    ctx.fillStyle = p.color;
    ctx.font = `bold ${Math.max(11, 15*sc)}px monospace`;
    ctx.fillText(p.label, cx-30, cy);
  });

  // 공유 꼭짓점 = 흰 이중 링 + 좌표 라벨 (경계 EXACT match 확인용)
  const shared = sharedMap();
  Object.keys(shared).forEach(k => {
    const [x, y] = k.split(',').map(Number);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.arc(x, y, Math.max(6, 11*sc), 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = '#0ea5e9'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, Math.max(9, 16*sc), 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.max(10, 12*sc)}px monospace`;
    ctx.fillText(`(${x},${y})`, x + 20, y + 4);
  });
}

function clearCurrent() {
  points[current] = [];
  updatePtCount();
  draw();
}

function toggleRef() {
  showRef = !showRef;
  document.getElementById('refBtn').textContent =
    '.py 적용값 참조선: ' + (showRef ? '켜짐' : '꺼짐');
  draw();
}

function clearAll() {
  polys.forEach(p => points[p.var] = []);
  updatePtCount();
  draw();
}

function resetCurrentCam() {
  polys.forEach(p => points[p.var] = deepCopy(baseline[p.var]));
  updatePtCount();
  draw();
}

function generateCode() {
  const im = curImg();
  const [pw, ph] = procSize();
  let code = `# ch_setting_comb.py 에 붙여넣기 (${camId})\n`;
  code += `# 대상: ${CAMERAS[camId].target}\n`;
  code += `# 배경 프레임: ${im.file} (${img.width}x${img.height})\n`;
  if (scaleOut === 'proc')
    code += `# 좌표: ${img.width}x${img.height} 에서 찍어 ${pw}x${ph} 로 배율 환산됨\n`;
  else
    code += `# 좌표: ${img.width}x${img.height} 픽셀 그대로 (환산 없음)\n`;
  code += `\n`;
  polys.forEach(p => {
    const pts = points[p.var];
    if (!pts || pts.length < 3) { code += `# ${p.var}: 미정의 (최소 3점 필요)\n\n`; return; }
    const arr = pts.map(pt => { const o = toOut(pt); return `[${o[0]},${o[1]}]`; }).join(',');
    if (p.dest) code += `# → ${p.dest}\n`;
    if (scaleOut === 'raw' && same(pts, baseline[p.var])) code += `#   (.py 적용값과 동일 — 변경 없음)\n`;
    code += `${p.var} = np.array([${arr}], np.int32)\n\n`;
  });
  if (camId === 'cam1') code += `cam1_lanes = [lane1_cam1, lane2_cam1]\n`;
  if (camId === 'cam3') code += `road_cam3 = None  # sidewalk/crosswalk 아닌 나머지 전부 = road\n`;
  document.getElementById('output').textContent = code;
}

// 셀렉트 핸들러
document.getElementById('camSel').addEventListener('change', e => loadCamera(e.target.value));
document.getElementById('imgSel').addEventListener('change', e => selectImage(e.target.value));
document.getElementById('scaleSel').addEventListener('change', e => {
  scaleOut = e.target.value; refreshGeoUI(); updatePtCount(); draw();
});

// 초기 로드: .py 를 먼저 읽고 나서 cam2 표시
loadPy().then(() => loadCamera('cam2'));
</script>
